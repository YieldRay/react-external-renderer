name: Publishing on NPM

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - ./packages/react-external-renderer/package.json

permissions:
    contents: read
    id-token: write

jobs:
    publish-npm:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: latest
                  registry-url: "https://registry.npmjs.org"
                  cache: "pnpm"

            - name: Build package
              run: |
                  mv ./README.md ./packages/react-external-renderer/
                  pnpm install
                  pnpm run build

            - name: Publishing on NPM
              uses: JS-DevTools/npm-publish@v4
              with:
                  access: public
                  provenance: true
